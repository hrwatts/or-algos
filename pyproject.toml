[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "or-algos"
version = "0.1.0"
description = "Python ports of small optimization algorithms originally written in MATLAB."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
  "scipy>=1.11",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "NPY"]
ignore = ["E501", "N803", "N806"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
incremental = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict = true

[[tool.mypy.overrides]]
module = ["sympy"]
ignore_missing_imports = true
